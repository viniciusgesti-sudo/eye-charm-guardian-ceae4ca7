name: Bundle Budget

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  bundle-budget:
    name: Build & check bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Uses the baseline in bundle-budget.baseline.json and the hard caps
      # defined in scripts/bundle-budget.mjs. Fails the job when any client
      # or server chunk exceeds its cap OR grows more than
      # BUDGET_MAX_GROWTH_PCT (default 40%) versus the baseline.
      - name: Build & bundle-budget check
        run: bun run build

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: |
            dist/reports/bundle-report.html
            dist/reports/bundle-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Comment bundle summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'dist/reports/bundle-report.json';
            if (!fs.existsSync(path)) {
              core.warning('No bundle-report.json produced — build likely failed before reporting.');
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const kb = (n) => `${(n / 1024).toFixed(1)} KB`;
            const top = (files, n = 5) =>
              [...files]
                .sort((a, b) => b.size - a.size)
                .slice(0, n)
                .map((f) => `- \`${f.path}\` — **${kb(f.size)}**`)
                .join('\n');

            const client = report.client ?? { files: [], totalBytes: 0 };
            const server = report.server ?? { files: [], totalBytes: 0 };
            const warnings = (report.warnings ?? [])
              .map((w) => `- ⚠️ ${w}`)
              .join('\n') || '_none_';

            const body = [
              '### 📦 Bundle Budget Report',
              '',
              `**Client total:** ${kb(client.totalBytes)}  `,
              `**Server total:** ${kb(server.totalBytes)}`,
              '',
              '**Top client chunks**',
              top(client.files),
              '',
              '**Top server chunks**',
              top(server.files),
              '',
              '**Warnings**',
              warnings,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- bundle-budget-report -->';
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const prev = comments.data.find((c) => c.body?.includes(marker));
            const payload = { owner, repo, body: `${marker}\n${body}` };
            if (prev) {
              await github.rest.issues.updateComment({ ...payload, comment_id: prev.id });
            } else {
              await github.rest.issues.createComment({ ...payload, issue_number });
            }
