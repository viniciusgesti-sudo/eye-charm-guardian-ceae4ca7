name: Bundle Budget

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Two profiles share the same script but different env vars + baseline slot.
#
#   PR    → strict growth gate (early warning). Uses the `pr` baseline slot,
#           blocks any chunk that grew >BUDGET_MAX_GROWTH_PCT (default 10%)
#           vs the last approved PR baseline. Hard caps are the standard prod
#           limits so a PR can never sneak past them.
#
#   main  → looser growth gate but same hard caps. Uses the `main` baseline
#           slot and auto-updates it after a successful push so the next PR
#           diffs against the latest shipped size.
#
# Override any budget locally with the matching BUDGET_* env var — see
# scripts/bundle-budget.mjs for the full list.

jobs:
  bundle-budget:
    name: Build & check bundle budget (${{ github.event_name == 'pull_request' && 'PR' || 'main' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      # Shared hard caps (identical for PR + main so nothing ships over budget).
      BUDGET_CLIENT_FILE_JS_KB: "600"
      BUDGET_CLIENT_FILE_CSS_KB: "200"
      BUDGET_CLIENT_TOTAL_KB: "1700"
      BUDGET_SERVER_FILE_KB: "700"
      BUDGET_SERVER_TOTAL_KB: "2700"
      BUDGET_WARN_PCT: "90"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --- PR profile: strict growth, no baseline write ---------------------
      - name: Build & bundle-budget check (PR profile)
        if: github.event_name == 'pull_request'
        env:
          BUDGET_BASELINE_ENV: pr
          # Any single chunk / total that grows >10% vs the PR baseline fails.
          BUDGET_MAX_GROWTH_PCT: "10"
        run: bun run build

      # --- main profile: looser growth, auto-update baseline after success --
      - name: Build & bundle-budget check (main profile)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BUDGET_BASELINE_ENV: main
          # main allows larger, intentional jumps (e.g. new page shipped).
          BUDGET_MAX_GROWTH_PCT: "25"
        run: bun run build

      - name: Refresh main baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          BUDGET_BASELINE_ENV: main
        run: |
          node scripts/bundle-budget.mjs --update-baseline
          if git diff --quiet -- bundle-budget.baseline.main.json; then
            echo "Baseline unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bundle-budget.baseline.main.json
          git commit -m "chore(budget): refresh main baseline [skip ci]"
          git push

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report-${{ github.event_name }}
          path: |
            dist/reports/bundle-report.html
            dist/reports/bundle-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Comment bundle summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'dist/reports/bundle-report.json';
            if (!fs.existsSync(path)) {
              core.warning('No bundle-report.json produced — build likely failed before reporting.');
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const fmt = (kb) => `${Number(kb).toFixed(1)} KB`;
            const totals = report.totals ?? {};
            const assets = report.assets ?? [];
            const violations = report.violations ?? [];
            const warnings = report.warnings ?? [];

            const topBySide = (side, n = 5) =>
              assets
                .filter((a) => a.side === side)
                .sort((a, b) => b.bytes - a.bytes)
                .slice(0, n)
                .map((a) => `- \`${a.path}\` — **${fmt(a.sizeKB)}** (${a.pctOfLimit}% of limit)`)
                .join('\n') || '_none_';

            const line = (t) => (t && t.sizeKB != null
              ? `${fmt(t.sizeKB)} / ${t.limitKB} KB (${t.pctOfLimit}%)`
              : '_n/a_');

            const flagged = assets.filter((a) => a.status && a.status !== 'ok');
            const flaggedList = flagged.length
              ? flagged.map((a) => `- ${a.status === 'fail' ? '❌' : '⚠️'} \`${a.path}\` — ${fmt(a.sizeKB)} (${a.pctOfLimit}%)`).join('\n')
              : '_none_';

            const status = violations.length ? '❌ **FAIL**' : (warnings.length ? '⚠️ warnings' : '✅ pass');

            const body = [
              '### 📦 Bundle Budget Report — PR profile (growth cap 10%)',
              '',
              `Status: ${status}`,
              '',
              `**Client total:** ${line(totals.client)}  `,
              `**Server total:** ${line(totals.server)}`,
              '',
              '**Top client chunks**',
              topBySide('client'),
              '',
              '**Top server chunks**',
              topBySide('server'),
              '',
              '**Flagged files**',
              flaggedList,
              '',
              violations.length ? '**Violations**\n' + violations.map((v) => `- ❌ ${typeof v === 'string' ? v : JSON.stringify(v)}`).join('\n') : '',
              warnings.length ? '**Warnings**\n' + warnings.map((w) => `- ⚠️ ${typeof w === 'string' ? w : JSON.stringify(w)}`).join('\n') : '',
            ].filter(Boolean).join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- bundle-budget-report -->';
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const prev = comments.data.find((c) => c.body?.includes(marker));
            const payload = { owner, repo, body: `${marker}\n${body}` };
            if (prev) {
              await github.rest.issues.updateComment({ ...payload, comment_id: prev.id });
            } else {
              await github.rest.issues.createComment({ ...payload, issue_number });
            }
