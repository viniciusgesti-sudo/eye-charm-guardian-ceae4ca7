name: Bundle Budget

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  bundle-budget:
    name: Build & check bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Uses the baseline in bundle-budget.baseline.json and the hard caps
      # defined in scripts/bundle-budget.mjs. Fails the job when any client
      # or server chunk exceeds its cap OR grows more than
      # BUDGET_MAX_GROWTH_PCT (default 40%) versus the baseline.
      - name: Build & bundle-budget check
        run: bun run build

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: |
            dist/reports/bundle-report.html
            dist/reports/bundle-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Comment bundle summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'dist/reports/bundle-report.json';
            if (!fs.existsSync(path)) {
              core.warning('No bundle-report.json produced — build likely failed before reporting.');
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const fmt = (kb) => `${Number(kb).toFixed(1)} KB`;
            const totals = report.totals ?? {};
            const assets = report.assets ?? [];
            const violations = report.violations ?? [];
            const warnings = report.warnings ?? [];

            const topBySide = (side, n = 5) =>
              assets
                .filter((a) => a.side === side)
                .sort((a, b) => b.bytes - a.bytes)
                .slice(0, n)
                .map((a) => `- \`${a.path}\` — **${fmt(a.sizeKB)}** (${a.pctOfLimit}% of limit)`)
                .join('\n') || '_none_';

            const line = (t) => (t && t.sizeKB != null
              ? `${fmt(t.sizeKB)} / ${t.limitKB} KB (${t.pctOfLimit}%)`
              : '_n/a_');

            const flagged = assets.filter((a) => a.status && a.status !== 'ok');
            const flaggedList = flagged.length
              ? flagged.map((a) => `- ${a.status === 'fail' ? '❌' : '⚠️'} \`${a.path}\` — ${fmt(a.sizeKB)} (${a.pctOfLimit}%)`).join('\n')
              : '_none_';

            const status = violations.length ? '❌ **FAIL**' : (warnings.length ? '⚠️ warnings' : '✅ pass');

            const body = [
              '### 📦 Bundle Budget Report',
              '',
              `Status: ${status}`,
              '',
              `**Client total:** ${line(totals.client)}  `,
              `**Server total:** ${line(totals.server)}`,
              '',
              '**Top client chunks**',
              topBySide('client'),
              '',
              '**Top server chunks**',
              topBySide('server'),
              '',
              '**Flagged files**',
              flaggedList,
              '',
              violations.length ? '**Violations**\n' + violations.map((v) => `- ❌ ${typeof v === 'string' ? v : JSON.stringify(v)}`).join('\n') : '',
              warnings.length ? '**Warnings**\n' + warnings.map((w) => `- ⚠️ ${typeof w === 'string' ? w : JSON.stringify(w)}`).join('\n') : '',
            ].filter(Boolean).join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- bundle-budget-report -->';
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const prev = comments.data.find((c) => c.body?.includes(marker));
            const payload = { owner, repo, body: `${marker}\n${body}` };
            if (prev) {
              await github.rest.issues.updateComment({ ...payload, comment_id: prev.id });
            } else {
              await github.rest.issues.createComment({ ...payload, issue_number });
            }
