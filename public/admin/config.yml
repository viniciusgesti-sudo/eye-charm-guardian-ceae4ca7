backend:
  name: git-gateway
  branch: main

i18n:
  structure: single_file
  locales: [PT, EN, FR]
  default_locale: PT

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "global"
    label: "⚙️ Configurações Globais"
    i18n: true
    files:
      - label: "Cabeçalho e Rodapé"
        name: "settings"
        file: "src/content/global.json"
        description: "Altere os links, e-mails e avisos de todas as páginas."
        i18n: true
        fields:
          - { label: "Aviso do Topo", name: "topbar", widget: "string", i18n: true }
          - { label: "Email de Contato", name: "contact_email", widget: "string" }
          - { label: "Instagram Link", name: "instagram_url", widget: "string" }
          - { label: "Texto do Rodapé", name: "footer_text", widget: "text", i18n: true }

  - name: "pages"
    label: "📄 Páginas do Site"
    i18n: true
    files:
      - label: "Página Inicial (Home)"
        name: "home"
        file: "src/content/home.json"
        description: "Altere os textos e a imagem do banner principal."
        i18n: true
        fields:
          - { label: "Título Principal", name: "heroTitle", widget: "string", i18n: true }
          - { label: "Subtítulo", name: "heroSubtitle", widget: "string", i18n: true }
          - { label: "Imagem de Fundo", name: "heroImage", widget: "image" }

      - label: "Sobre a Eyegis"
        name: "about"
        file: "src/content/about.json"
        i18n: true
        fields:
          - { label: "Título", name: "title", widget: "string", i18n: true }
          - { label: "Missão", name: "mission", widget: "text", i18n: true }

      - label: "Coleção Homem"
        name: "men"
        file: "src/content/men.json"
        i18n: true
        fields:
          - { label: "Eyebrow (Texto Peq)", name: "eyebrow", widget: "string", i18n: true }
          - { label: "Título Principal", name: "title", widget: "string", i18n: true }
          - { label: "Destaque do Título", name: "titleAccent", widget: "string", i18n: true }
          - { label: "Subtítulo", name: "subtitle", widget: "text", i18n: true }
          - { label: "Texto do Botão", name: "ctaLabel", widget: "string", i18n: true }
          - { label: "Título SEO", name: "metaTitle", widget: "string", i18n: true }
          - { label: "Descrição SEO", name: "metaDesc", widget: "text", i18n: true }

      - label: "Coleção Mulher"
        name: "women"
        file: "src/content/women.json"
        i18n: true
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
          - { label: "Título", name: "title", widget: "string", i18n: true }
          - { label: "Destaque", name: "titleAccent", widget: "string", i18n: true }
          - { label: "Subtítulo", name: "subtitle", widget: "text", i18n: true }
          - { label: "Botão", name: "ctaLabel", widget: "string", i18n: true }

      - label: "Coleção Kids"
        name: "kids"
        file: "src/content/kids.json"
        i18n: true
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
          - { label: "Título", name: "title", widget: "string", i18n: true }
          - { label: "Destaque", name: "titleAccent", widget: "string", i18n: true }
          - { label: "Subtítulo", name: "subtitle", widget: "text", i18n: true }
          - { label: "Botão", name: "ctaLabel", widget: "string", i18n: true }

      - label: "Página de Lentes"
        name: "lenses"
        file: "src/content/lenses_page.json"
        i18n: true
        fields:
          - { label: "Hero Title 1", name: "hero.h1a", widget: "string", i18n: true }
          - { label: "Hero Title 2", name: "hero.h1b", widget: "string", i18n: true }
          - { label: "Hero Sub", name: "hero.sub", widget: "text", i18n: true }
          - { label: "Compare Title", name: "compare.h2a", widget: "string", i18n: true }
          - { label: "Compare Sub", name: "compare.h2b", widget: "string", i18n: true }
          - label: "Personas"
            name: "personas"
            widget: "list"
            i18n: true
            fields:
              - { label: "Label", name: "label", widget: "string", i18n: true }
              - { label: "Description", name: "desc", widget: "text", i18n: true }
              - { label: "Product Name", name: "product.name", widget: "string", i18n: true }
              - { label: "Product Desc", name: "product.desc", widget: "text", i18n: true }
          - label: "Lenses"
            name: "lenses"
            widget: "list"
            i18n: true
            fields:
              - { label: "Name", name: "name", widget: "string", i18n: true }
              - { label: "Tagline", name: "tagline", widget: "string", i18n: true }
          - label: "FAQ Items"
            name: "faq.items"
            widget: "list"
            i18n: true
            fields:
              - { label: "Question", name: "q", widget: "string", i18n: true }
              - { label: "Answer", name: "a", widget: "text", i18n: true }
          - label: "CTA"
            name: "cta"
            widget: "object"
            i18n: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
              - { label: "H2A", name: "h2a", widget: "string", i18n: true }
              - { label: "H2B", name: "h2b", widget: "string", i18n: true }
              - { label: "Body", name: "body", widget: "text", i18n: true }
              - { label: "Take Action", name: "take", widget: "string", i18n: true }
              - { label: "Browse", name: "browse", widget: "string", i18n: true }
              - { label: "Buy", name: "buy", widget: "string", i18n: true }

  - name: "components"
    label: "🧩 Componentes Globais"
    i18n: true
    files:
      - label: "O Que Vem na Caixa"
        name: "whatsinthebox"
        file: "src/content/whatsinthebox.json"
        i18n: true
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
          - { label: "Title 1", name: "title1", widget: "string", i18n: true }
          - { label: "Title 2", name: "title2", widget: "string", i18n: true }
          - { label: "Lead", name: "lead", widget: "text", i18n: true }
          - label: "Items"
            name: "items"
            widget: "list"
            i18n: true
            fields:
              - { label: "Title", name: "title", widget: "string", i18n: true }
              - { label: "Body", name: "body", widget: "text", i18n: true }

      - label: "Comprar na Amazon"
        name: "shoponamazon"
        file: "src/content/shoponamazon.json"
        i18n: true
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
          - { label: "Title 1", name: "title1", widget: "string", i18n: true }
          - { label: "Title 2", name: "title2", widget: "string", i18n: true }
          - { label: "Body", name: "body", widget: "text", i18n: true }
          - { label: "Primary Button", name: "primary", widget: "string", i18n: true }
          - { label: "Coming Soon Text", name: "comingSoon", widget: "string", i18n: true }
          - { label: "Reviews Text", name: "reviews", widget: "string", i18n: true }
          - { label: "Trust Labels", name: "trust", widget: "list", i18n: true, field: { label: "Item", name: "item", widget: "string" } }

      - label: "Estilo de Vida (Lifestyle)"
        name: "lifestyle"
        file: "src/content/lifestyle.json"
        i18n: true
        fields:
          - { label: "Section", name: "section", widget: "string", i18n: true }
          - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
          - { label: "Headline 1", name: "headline1", widget: "string", i18n: true }
          - { label: "Headline 2", name: "headline2", widget: "string", i18n: true }
          - { label: "Lead", name: "lead", widget: "text", i18n: true }
          - label: "Tabs"
            name: "tabs"
            widget: "list"
            i18n: true
            fields:
              - { label: "ID", name: "id", widget: "string", i18n: true }
              - { label: "Label", name: "label", widget: "string", i18n: true }
          - label: "Universes"
            name: "universes"
            widget: "object"
            i18n: true
            fields:
              - label: "Developer"
                name: "developer"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Quote", name: "quote", widget: "text", i18n: true }
                  - { label: "Author", name: "author", widget: "string", i18n: true }
                  - { label: "Detail", name: "detail", widget: "text", i18n: true }
                  - label: "Metrics"
                    name: "metrics"
                    widget: "list"
                    i18n: true
                    fields:
                      - { label: "Value", name: "value", widget: "string", i18n: true }
                      - { label: "Label", name: "label", widget: "string", i18n: true }
              - label: "Designer"
                name: "designer"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Quote", name: "quote", widget: "text", i18n: true }
                  - { label: "Author", name: "author", widget: "string", i18n: true }
                  - { label: "Detail", name: "detail", widget: "text", i18n: true }
                  - label: "Metrics"
                    name: "metrics"
                    widget: "list"
                    i18n: true
                    fields:
                      - { label: "Value", name: "value", widget: "string", i18n: true }
                      - { label: "Label", name: "label", widget: "string", i18n: true }
              - label: "Trader"
                name: "trader"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Quote", name: "quote", widget: "text", i18n: true }
                  - { label: "Author", name: "author", widget: "string", i18n: true }
                  - { label: "Detail", name: "detail", widget: "text", i18n: true }
                  - label: "Metrics"
                    name: "metrics"
                    widget: "list"
                    i18n: true
                    fields:
                      - { label: "Value", name: "value", widget: "string", i18n: true }
                      - { label: "Label", name: "label", widget: "string", i18n: true }
              - label: "Creator"
                name: "creator"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Quote", name: "quote", widget: "text", i18n: true }
                  - { label: "Author", name: "author", widget: "string", i18n: true }
                  - { label: "Detail", name: "detail", widget: "text", i18n: true }
                  - label: "Metrics"
                    name: "metrics"
                    widget: "list"
                    i18n: true
                    fields:
                      - { label: "Value", name: "value", widget: "string", i18n: true }
                      - { label: "Label", name: "label", widget: "string", i18n: true }
              - label: "Gamer"
                name: "gamer"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Quote", name: "quote", widget: "text", i18n: true }
                  - { label: "Author", name: "author", widget: "string", i18n: true }
                  - { label: "Detail", name: "detail", widget: "text", i18n: true }
                  - label: "Metrics"
                    name: "metrics"
                    widget: "list"
                    i18n: true
                    fields:
                      - { label: "Value", name: "value", widget: "string", i18n: true }
                      - { label: "Label", name: "label", widget: "string", i18n: true }

      - label: "Navegação Coleções"
        name: "collection_comp"
        file: "src/content/collection_comp.json"
        i18n: true
        fields:
          - { label: "Section", name: "section", widget: "string", i18n: true }
          - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
          - { label: "Intro Headline 1", name: "introHeadline1", widget: "string", i18n: true }
          - { label: "Intro Headline 2", name: "introHeadline2", widget: "string", i18n: true }
          - { label: "Intro Lead", name: "introLead", widget: "text", i18n: true }
          - { label: "Intro Lead Sub", name: "introLeadSub", widget: "text", i18n: true }
          - label: "Collections"
            name: "collections"
            widget: "object"
            i18n: true
            fields:
              - label: "Men"
                name: "men"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Label", name: "label", widget: "string", i18n: true }
                  - { label: "City", name: "city", widget: "string", i18n: true }
                  - { label: "Headline", name: "headline", widget: "string", i18n: true }
                  - { label: "Script Word", name: "scriptWord", widget: "string", i18n: true }
                  - { label: "Supporting", name: "supporting", widget: "text", i18n: true }
                  - { label: "Highlights", name: "highlights", widget: "list", i18n: true }
                  - { label: "Primary CTA", name: "primaryCta", widget: "string", i18n: true }
              - label: "Women"
                name: "women"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Label", name: "label", widget: "string", i18n: true }
                  - { label: "City", name: "city", widget: "string", i18n: true }
                  - { label: "Headline", name: "headline", widget: "string", i18n: true }
                  - { label: "Script Word", name: "scriptWord", widget: "string", i18n: true }
                  - { label: "Supporting", name: "supporting", widget: "text", i18n: true }
                  - { label: "Highlights", name: "highlights", widget: "list", i18n: true }
                  - { label: "Primary CTA", name: "primaryCta", widget: "string", i18n: true }
              - label: "Kids"
                name: "kids"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Label", name: "label", widget: "string", i18n: true }
                  - { label: "City", name: "city", widget: "string", i18n: true }
                  - { label: "Headline", name: "headline", widget: "string", i18n: true }
                  - { label: "Script Word", name: "scriptWord", widget: "string", i18n: true }
                  - { label: "Supporting", name: "supporting", widget: "text", i18n: true }
                  - { label: "Highlights", name: "highlights", widget: "list", i18n: true }
                  - { label: "Primary CTA", name: "primaryCta", widget: "string", i18n: true }
          - { label: "Buy On Amazon", name: "buyOnAmazon", widget: "string", i18n: true }
          - { label: "Amazon Note", name: "amazonNote", widget: "string", i18n: true }
          - label: "Preview Section"
            name: "preview"
            widget: "object"
            i18n: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
              - { label: "Headline 1", name: "headline1", widget: "string", i18n: true }
              - { label: "Headline 2", name: "headline2", widget: "string", i18n: true }
              - { label: "Lead", name: "lead", widget: "text", i18n: true }
              - { label: "Filter Label", name: "filterLabel", widget: "string", i18n: true }
              - { label: "Scroll Left", name: "scrollLeft", widget: "string", i18n: true }
              - { label: "Scroll Right", name: "scrollRight", widget: "string", i18n: true }
              - { label: "Empty", name: "empty", widget: "string", i18n: true }
              - { label: "Best Seller", name: "bestSeller", widget: "string", i18n: true }
              - { label: "Newest", name: "newest", widget: "string", i18n: true }
              - { label: "Warranty", name: "warranty", widget: "string", i18n: true }
              - { label: "Comfort", name: "comfort", widget: "string", i18n: true }
              - { label: "Learn More", name: "learnMore", widget: "string", i18n: true }
          - label: "Products"
            name: "products"
            widget: "object"
            i18n: true
            fields:
              - label: "Meridian"
                name: "meridian"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Name", name: "name", widget: "string", i18n: true }
                  - { label: "Collection", name: "collection", widget: "string", i18n: true }
                  - { label: "City", name: "city", widget: "string", i18n: true }
                  - { label: "Description", name: "description", widget: "text", i18n: true }
              - label: "Atelier"
                name: "atelier"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Name", name: "name", widget: "string", i18n: true }
                  - { label: "Collection", name: "collection", widget: "string", i18n: true }
                  - { label: "City", name: "city", widget: "string", i18n: true }
                  - { label: "Description", name: "description", widget: "text", i18n: true }
              - label: "Solene"
                name: "solene"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Name", name: "name", widget: "string", i18n: true }
                  - { label: "Collection", name: "collection", widget: "string", i18n: true }
                  - { label: "City", name: "city", widget: "string", i18n: true }
                  - { label: "Description", name: "description", widget: "text", i18n: true }
              - label: "Marais"
                name: "marais"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Name", name: "name", widget: "string", i18n: true }
                  - { label: "Collection", name: "collection", widget: "string", i18n: true }
                  - { label: "City", name: "city", widget: "string", i18n: true }
                  - { label: "Description", name: "description", widget: "text", i18n: true }
              - label: "Meridian Pair"
                name: "meridian-pair"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Name", name: "name", widget: "string", i18n: true }
                  - { label: "Collection", name: "collection", widget: "string", i18n: true }
                  - { label: "City", name: "city", widget: "string", i18n: true }
                  - { label: "Description", name: "description", widget: "text", i18n: true }
              - label: "Atelier Profile"
                name: "atelier-profile"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Name", name: "name", widget: "string", i18n: true }
                  - { label: "Collection", name: "collection", widget: "string", i18n: true }
                  - { label: "City", name: "city", widget: "string", i18n: true }
                  - { label: "Description", name: "description", widget: "text", i18n: true }
              - label: "Solene Macro"
                name: "solene-macro"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Name", name: "name", widget: "string", i18n: true }
                  - { label: "Collection", name: "collection", widget: "string", i18n: true }
                  - { label: "City", name: "city", widget: "string", i18n: true }
                  - { label: "Description", name: "description", widget: "text", i18n: true }
              - label: "Atelier Kids"
                name: "atelier-kids"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Name", name: "name", widget: "string", i18n: true }
                  - { label: "Collection", name: "collection", widget: "string", i18n: true }
                  - { label: "City", name: "city", widget: "string", i18n: true }
                  - { label: "Description", name: "description", widget: "text", i18n: true }
          - label: "Closing"
            name: "closing"
            widget: "object"
            i18n: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
              - { label: "Headline 1", name: "headline1", widget: "string", i18n: true }
              - { label: "Headline 2", name: "headline2", widget: "string", i18n: true }
              - { label: "Lead", name: "lead", widget: "text", i18n: true }
              - { label: "CTA Tech", name: "ctaTech", widget: "string", i18n: true }
              - { label: "CTA Amazon", name: "ctaAmazon", widget: "string", i18n: true }
              - { label: "EST", name: "est", widget: "string", i18n: true }
              - { label: "Cities", name: "cities", widget: "string", i18n: true }

  - name: "products"
    label: "🛍️ Produtos"
    folder: "src/content/products"
    create: true
    i18n: true
    slug: "{{slug}}"
    fields:
      - { label: "Identificador (slug)", name: "slug", widget: "string" }
      - { label: "Nome do Produto", name: "name", widget: "string", i18n: true }
      - { label: "Preço Padrão", name: "price", widget: "string", i18n: true }
      - { label: "Link de Compra (Amazon/Wix)", name: "buy_link", widget: "string", i18n: true }
      - { label: "Imagem Principal", name: "main_image", widget: "image" }
      - { label: "Descrição Curta", name: "short_desc", widget: "text", i18n: true }
      - { label: "Especificações", name: "specs", widget: "list", i18n: true, field: { label: "Item", name: "item", widget: "string" } }

  - name: "faq"
    label: "❓ Perguntas Frequentes (FAQ)"
    i18n: true
    files:
      - label: "Lista de FAQs"
        name: "faq_list"
        file: "src/content/faq.json"
        i18n: true
        fields:
          - label: "Perguntas"
            name: "questions"
            widget: "list"
            i18n: true
            fields:
              - { label: "Pergunta", name: "q", widget: "string", i18n: true }
              - { label: "Resposta", name: "a", widget: "text", i18n: true }
