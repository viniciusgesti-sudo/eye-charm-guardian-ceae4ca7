<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Painel Administrativo - Eyegis Vision</title>
  </head>
  <body>
    <!-- Script do Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
    <script>
      var h = wpElement.createElement;
      
      // Preview do About
      var AboutPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'PT', 'title']);
          var mission = entry.getIn(['data', 'PT', 'mission']);
          return h('div', {style: {fontFamily: 'Inter, sans-serif', padding: '40px', backgroundColor: '#F6F3EE', minHeight: '100vh', color: '#060C12'}},
            h('h1', {style: {fontSize: '2.5rem', fontWeight: '300', marginBottom: '1rem', fontFamily: 'serif'}}, title || 'Título...'),
            h('p', {style: {fontSize: '1.125rem', lineHeight: '1.6', opacity: 0.8}}, mission || 'Escreva a missão aqui...')
          );
        }
      });
      CMS.registerPreviewTemplate('about', AboutPreview);

      // Preview da Home
      var HomePreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'heroTitle']);
          var subtitle = entry.getIn(['data', 'heroSubtitle']);
          return h('div', {style: {fontFamily: 'Inter, sans-serif', padding: '60px', backgroundColor: '#060C12', color: '#F6F3EE', minHeight: '100vh', textAlign: 'center', display: 'flex', flexDirection: 'column', justifyContent: 'center'}},
            h('div', {style: {textTransform: 'uppercase', letterSpacing: '4px', fontSize: '10px', color: '#86D9D1', marginBottom: '20px'}}, subtitle || 'Subtítulo...'),
            h('h1', {style: {fontSize: '3rem', fontWeight: '300', fontFamily: 'serif', lineHeight: '1.1'}}, title || 'Título Principal...')
          );
        }
      });
      CMS.registerPreviewTemplate('home', HomePreview);

      // Preview dos Produtos
      var ProductPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var name = entry.getIn(['data', 'name']);
          var price = entry.getIn(['data', 'price']);
          var desc = entry.getIn(['data', 'details_pt', 'short_desc']);
          return h('div', {style: {fontFamily: 'Inter, sans-serif', padding: '40px', backgroundColor: '#FFFFFF', color: '#060C12', minHeight: '100vh'}},
            h('div', {style: {textTransform: 'uppercase', letterSpacing: '2px', fontSize: '12px', color: '#86D9D1', marginBottom: '10px'}}, 'Produto'),
            h('h1', {style: {fontSize: '2.5rem', fontWeight: '300', fontFamily: 'serif', marginBottom: '10px'}}, name || 'Nome do Produto...'),
            h('div', {style: {fontSize: '1.5rem', marginBottom: '20px'}}, '$' + (price || '0.00')),
            h('p', {style: {fontSize: '1.1rem', lineHeight: '1.6', color: '#555'}}, desc || 'Descrição curta do produto...')
          );
        }
      });
      CMS.registerPreviewTemplate('products', ProductPreview);
    </script>
  </body>
</html>
