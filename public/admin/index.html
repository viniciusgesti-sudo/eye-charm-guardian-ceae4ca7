<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Painel Administrativo - Eyegis Vision</title>
  </head>
  <body>
    <!-- Script do Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
    <script>
      var h = wpElement.createElement;
      
      // Helper function to get data, handling i18n structure if Decap exposes it as nested
      function getI18nField(entry, fieldName, locale) {
        var val = entry.getIn(['data', fieldName]);
        if (val === undefined) {
          val = entry.getIn(['data', locale || 'PT', fieldName]);
        }
        return val;
      }

      // Preview do About
      var AboutPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var title = getI18nField(entry, 'title');
          var mission = getI18nField(entry, 'mission');
          return h('div', {style: {fontFamily: 'Inter, sans-serif', padding: '40px', backgroundColor: '#F6F3EE', minHeight: '100vh', color: '#060C12'}},
            h('h1', {style: {fontSize: '2.5rem', fontWeight: '300', marginBottom: '1rem', fontFamily: 'serif'}}, title || 'Título...'),
            h('p', {style: {fontSize: '1.125rem', lineHeight: '1.6', opacity: 0.8, whiteSpace: 'pre-wrap'}}, mission || 'Escreva a missão aqui...')
          );
        }
      });
      CMS.registerPreviewTemplate('about', AboutPreview);

      // Preview da Home
      var HomePreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var getAsset = this.props.getAsset;
          var title = getI18nField(entry, 'heroTitle');
          var subtitle = getI18nField(entry, 'heroSubtitle');
          var image = getI18nField(entry, 'heroImage');
          var imageUrl = image ? getAsset(image).toString() : '';

          return h('div', {style: {position: 'relative', fontFamily: 'Inter, sans-serif', backgroundColor: '#060C12', color: '#F6F3EE', minHeight: '100vh', textAlign: 'center', display: 'flex', flexDirection: 'column', justifyContent: 'center'}},
            imageUrl ? h('img', {src: imageUrl, style: {position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', objectFit: 'cover', opacity: 0.5}}) : null,
            h('div', {style: {position: 'relative', zIndex: 1, padding: '60px'}},
              h('div', {style: {textTransform: 'uppercase', letterSpacing: '4px', fontSize: '10px', color: '#86D9D1', marginBottom: '20px'}}, subtitle || 'Subtítulo...'),
              h('h1', {style: {fontSize: '3rem', fontWeight: '300', fontFamily: 'serif', lineHeight: '1.1'}}, title || 'Título Principal...')
            )
          );
        }
      });
      CMS.registerPreviewTemplate('home', HomePreview);

      // Preview das Coleções (Homem, Mulher, Kids)
      var CollectionPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var eyebrow = getI18nField(entry, 'eyebrow');
          var title = getI18nField(entry, 'title');
          var titleAccent = getI18nField(entry, 'titleAccent');
          var subtitle = getI18nField(entry, 'subtitle');
          var ctaLabel = getI18nField(entry, 'ctaLabel');
          
          return h('div', {style: {fontFamily: 'Inter, sans-serif', padding: '60px', backgroundColor: '#F6F3EE', color: '#060C12', minHeight: '100vh'}},
            h('div', {style: {textTransform: 'uppercase', letterSpacing: '2px', fontSize: '12px', color: '#0C3B39', marginBottom: '20px', fontWeight: 'bold'}}, eyebrow || 'Eyebrow...'),
            h('h1', {style: {fontSize: '3.5rem', fontWeight: '400', fontFamily: 'serif', lineHeight: '1.1', marginBottom: '20px'}}, 
              title || 'Título', 
              h('br'), 
              h('span', {style: {fontStyle: 'italic', color: '#0C3B39'}}, titleAccent || 'Destaque')
            ),
            h('p', {style: {fontSize: '1.2rem', lineHeight: '1.6', opacity: 0.8, maxWidth: '600px', marginBottom: '40px'}}, subtitle || 'Subtítulo...'),
            h('button', {style: {padding: '12px 24px', backgroundColor: '#060C12', color: '#FFF', border: 'none', borderRadius: '30px', textTransform: 'uppercase', letterSpacing: '1px', fontSize: '12px', cursor: 'pointer'}}, ctaLabel || 'Botão')
          );
        }
      });
      CMS.registerPreviewTemplate('men', CollectionPreview);
      CMS.registerPreviewTemplate('women', CollectionPreview);
      CMS.registerPreviewTemplate('kids', CollectionPreview);
    </script>
  </body>
</html>
